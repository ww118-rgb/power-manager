name: Publish HACS v3.3.3 unified output test

on:
  push:
    branches: ["feature/v3.3.3-unified-output-units"]
    paths:
      - ".github/workflows/publish-hacs-v3-3-3.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check release origin and version
        run: |
          test "$GITHUB_REF_NAME" = "feature/v3.3.3-unified-output-units"
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("custom_components/power_manager")
          assert json.loads((base/"manifest.json").read_text())["version"] == "3.3.3"
          assert 'VERSION = "3.3.3"' in (base/"const.py").read_text()
          assert "3.3.3" in (base/"frontend"/"power-manager-card.js").read_text()
          assert (base/"device_units.py").is_file()
          assert Path("docs/RELEASE_NOTES_V3_3_3.md").is_file()
          PY
      - name: Run automated regression suite
        run: |
          python -m pip install pytest
          python -m compileall -q custom_components/power_manager
          node --check custom_components/power_manager/frontend/power-manager-card.js
          python -m pytest -q
      - name: Publish immutable v3.3.3 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.3.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.3.3 already exists, refusing to move release tag."
            gh release view v3.3.3 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create v3.3.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Power Manager v3.3.3 – einheitliche kW-Regelung und HA-Ausgabe' \
            --notes-file docs/RELEASE_NOTES_V3_3_3.md \
            --prerelease
          gh release view v3.3.3 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
