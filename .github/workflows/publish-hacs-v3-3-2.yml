name: Publish HACS v3.3.2 EVSE test version

on:
  push:
    branches: ["feature/v3.3.2-evse-output-fix"]
    paths:
      - ".github/workflows/publish-hacs-v3-3-2.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate v3.3.2 release source
        run: |
          test "$GITHUB_REF_NAME" = "feature/v3.3.2-evse-output-fix"
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("custom_components/power_manager")
          assert json.loads((p/"manifest.json").read_text())["version"] == "3.3.2"
          assert 'VERSION = "3.3.2"' in (p/"const.py").read_text()
          assert '3.3.2' in (p/"frontend"/"power-manager-card.js").read_text()
          assert Path("docs/RELEASE_NOTES_V3_3_2.md").is_file()
          for lang in ("de", "en"):
              translations = json.loads((p/"translations"/f"{lang}.json").read_text())
              assert "load_evse_format" in translations["config_subentries"]["load"]["step"]
          PY
      - name: Run full tests
        run: |
          python -m pip install pytest
          python -m compileall -q custom_components/power_manager
          node --check custom_components/power_manager/frontend/power-manager-card.js
          python -m pytest -q
      - name: Publish immutable HACS pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.3.2 already published; refusing to overwrite or retag."
            gh release view v3.3.2 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create v3.3.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Power Manager v3.3.2 – sichere EVSE A/W/kW-Testversion' \
            --notes-file docs/RELEASE_NOTES_V3_3_2.md \
            --prerelease
          gh release view v3.3.2 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
