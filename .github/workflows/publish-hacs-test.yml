name: Publish HACS v3.3.0 test version

on:
  push:
    branches: ["feature/v3.3.0-rc"]
    paths:
      - ".github/workflows/publish-hacs-test.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm branch and integration version
        run: |
          test "$GITHUB_REF_NAME" = "feature/v3.3.0-rc"
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("custom_components/power_manager/manifest.json").read_text())["version"]
          assert version == "3.3.0", version
          assert Path("custom_components/power_manager/protocols.py").exists()
          assert Path("docs/RELEASE_NOTES_V3_3_0_TEST.md").exists()
          PY
      - name: Publish v3.3.0 specifically as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v3.3.0 already exists; refusing to overwrite published bytes."
            exit 1
          fi
          gh release create v3.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Power Manager v3.3.0 – HACS-Testversion' \
            --notes-file docs/RELEASE_NOTES_V3_3_0_TEST.md \
            --prerelease
          gh release view v3.3.0 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,htmlUrl,targetCommitish
