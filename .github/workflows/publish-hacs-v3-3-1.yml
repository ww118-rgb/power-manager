name: Publish HACS v3.3.1 guided test version

on:
  push:
    branches: ["feature/v3.3.1-simple-wizard"]
    paths:
      - ".github/workflows/publish-hacs-v3-3-1.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate fixed v3.3.1 release source
        run: |
          test "$GITHUB_REF_NAME" = "feature/v3.3.1-simple-wizard"
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("custom_components/power_manager")
          assert json.loads((p/"manifest.json").read_text())["version"] == "3.3.1"
          assert "3.3.1" in (p/"const.py").read_text()
          assert "3.3.1" in (p/"frontend"/"power-manager-card.js").read_text()
          assert Path("docs/RELEASE_NOTES_V3_3_1.md").is_file()
          PY
      - name: Install unit test dependencies
        run: python -m pip install pytest
      - name: Test before releasing
        run: |
          python -m compileall -q custom_components/power_manager
          node --check custom_components/power_manager/frontend/power-manager-card.js
          python -m pytest -q
      - name: Publish immutable test tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.3.1 already published; not retagging or overwriting."
            gh release view v3.3.1 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create v3.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Power Manager v3.3.1 – einfacher HACS-Testassistent' \
            --notes-file docs/RELEASE_NOTES_V3_3_1.md \
            --prerelease
          gh release view v3.3.1 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
