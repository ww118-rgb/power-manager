name: HA Core compatibility smoke test

on:
  push:
    branches: ["feature/v3.3.0-rc", "feature/v3.3.1-simple-wizard", "feature/v3.3.2-evse-output-fix"]
  workflow_dispatch:

jobs:
  integration-import:
    name: "Import integration on HA ${{ matrix.ha_min }} / Python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            ha_min: "2026.8.0"
            ha_max: "2026.9.0"
          - python: "3.14"
            ha_min: "2026.10.0"
            ha_max: "2026.11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual Home Assistant Core runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=${{ matrix.ha_min }},<${{ matrix.ha_max }}"
      - name: Import Power Manager setup, flow and platforms
        run: |
          python - <<'PY'
          import importlib
          import homeassistant
          names = [
              "custom_components.power_manager",
              "custom_components.power_manager.config_flow",
              "custom_components.power_manager.coordinator",
              "custom_components.power_manager.sensor",
              "custom_components.power_manager.binary_sensor",
              "custom_components.power_manager.switch",
              "custom_components.power_manager.select",
              "custom_components.power_manager.actuator",
              "custom_components.power_manager.protocols",
          ]
          for name in names:
              importlib.import_module(name)
              print("OK", name)
          from homeassistant.config_entries import ConfigSubentryFlow
          from custom_components.power_manager.config_flow import PowerManagerConfigFlow
          assert PowerManagerConfigFlow is not None
          print("Home Assistant Core integration smoke import successful")

          from custom_components.power_manager.config_flow import (
              _global_simple_schema, _global_expert_schema, _load_wizard_schema,
              PowerManagerLoadSubentryFlow,
          )
          from custom_components.power_manager.const import (
              CONF_LOAD_NAME, CONF_LOAD_TYPE, CONF_PRIORITY, CONF_MAX_KW,
              CONF_MODBUS_HOST, CONF_MODBUS_REGISTER, CONF_MQTT_TOPIC,
          )
          basics = _global_simple_schema({})
          assert len(basics.schema) <= 9, len(basics.schema)
          expert = _global_expert_schema({})
          assert len(expert.schema) >= 7
          def names(schema):
              return {getattr(k, "schema", k) for k in schema.schema}
          basic_load = _load_wizard_schema({}, (
              CONF_LOAD_NAME, CONF_LOAD_TYPE, CONF_PRIORITY, CONF_MAX_KW,
          ))
          assert names(basic_load) == {
              CONF_LOAD_NAME, CONF_LOAD_TYPE, CONF_PRIORITY, CONF_MAX_KW,
          }
          modbus = _load_wizard_schema({}, (
              CONF_MODBUS_HOST, CONF_MODBUS_REGISTER,
          ))
          assert CONF_MQTT_TOPIC not in names(modbus)
          print("Guided installation schemas render with real HA selectors")

          import asyncio
          from custom_components.power_manager.const import (
              LOAD_TYPE_EVSE, CONF_ACTUAL_POWER_ENTITY,
              CONF_PEAK_SHAVING_ENABLED, CONF_SURPLUS_ENABLED,
              CONF_OUTPUT_TRANSPORT, OUTPUT_TRANSPORT_ENTITY,
          )
          async def exercise_wizard():
              flow = PowerManagerLoadSubentryFlow()
              page = await flow.async_step_user()
              assert page["step_id"] == "load_basics", page
              page = await flow.async_step_load_basics({
                  CONF_LOAD_NAME:"Car",CONF_LOAD_TYPE:LOAD_TYPE_EVSE,
                  CONF_PRIORITY:1,CONF_MAX_KW:11.0,
                  "wizard_expert":False,
              })
              assert page["step_id"] == "load_usage", page
              page = await flow.async_step_load_usage({
                  "demand_mode":"always",CONF_PEAK_SHAVING_ENABLED:True,
                  CONF_SURPLUS_ENABLED:True,CONF_ACTUAL_POWER_ENTITY:"sensor.car_kw",
              })
              assert page["step_id"] == "load_connection", page
              page = await flow.async_step_load_connection({
                  CONF_OUTPUT_TRANSPORT:OUTPUT_TRANSPORT_ENTITY,
              })
              assert page["step_id"] == "load_connection_details", page
              page = await flow.async_step_load_connection_details({
                  "output_entity":"number.car_current",
              })
              assert page["step_id"] == "load_evse_format", page
              page = await flow.async_step_load_evse_format({
                  "evse_output_format":"kW",
              })
              assert page["step_id"] == "load_commands", page
              page = await flow.async_step_load_commands({
                  "evse_phases":3,"evse_min_current_a":6,
                  "evse_max_current_a":16,"evse_power_step_w":1000,
                  "evse_pause_power_value":0,
              })
              assert page["step_id"] == "load_review", page
              assert abs(flow._draft["min_kw"] - 4.14) < 1e-6
              assert flow._draft["evse_output_format"] == "kW"
              page = await flow.async_step_load_review({"wizard_ack":False})
              assert page["step_id"] == "load_review"
              print("End-to-end EVSE installation wizard steps work with HA Core")
          async def verify_complete_modbus_wizard():
              from types import SimpleNamespace
              flow = PowerManagerLoadSubentryFlow()
              # The HA flow manager normally injects this metadata.
              flow.context = {"source": "user"}
              flow._get_entry = lambda: SimpleNamespace(subentries={})
              page = await flow.async_step_user()
              page = await flow.async_step_load_basics({
                  CONF_LOAD_NAME:"Pump",CONF_LOAD_TYPE:"modulating",
                  CONF_PRIORITY:2,CONF_MAX_KW:8.0,"wizard_expert":False,
              })
              page = await flow.async_step_load_usage({
                  "demand_mode":"disabled",
                  "peak_shaving_enabled":True,"surplus_enabled":True,
                  "min_kw":0.5,"actual_power_entity":"sensor.pump_power",
              })
              page = await flow.async_step_load_connection({
                  "output_transport":"modbus_tcp","output_value_mode":"linear",
              })
              assert page["step_id"] == "load_connection_details"
              page = await flow.async_step_load_connection_details({
                  "modbus_host":"192.168.1.37","modbus_port":5027,
                  "modbus_unit_id":6,"modbus_register":770,
                  "modbus_data_type":"float32",
                  "modbus_byte_order":"ABCD","modbus_function":16,
              })
              assert page["step_id"] == "load_commands"
              page = await flow.async_step_load_commands({
                  "output_scale":1.0,"output_offset":0.0,
                  "safe_output_value":0.01,"output_forbidden_value":0.0,
              })
              assert page["step_id"] == "load_review"
              page = await flow.async_step_load_review({
                  "wizard_ack":True,"device_commands_confirmed":True,
              })
              assert str(page["type"]) in (
                  "FlowResultType.CREATE_ENTRY", "create_entry",
              ), page
              assert page["data"]["demand_mode"] == "disabled"
              assert page["data"]["modbus_register"] == 770
              assert page["data"]["safe_output_value"] == 0.01
              print("Modbus direct-load wizard creates valid entry on HA Core")
          asyncio.run(verify_complete_modbus_wizard())
          asyncio.run(exercise_wizard())
          PY
