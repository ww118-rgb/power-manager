name: Publish HACS v3.3.5 simple grid and PV surplus simulator test

on:
  push:
    branches: ["fix/v3.3.5-simple-grid-and-pv"]
    paths:
      - ".github/workflows/publish-hacs-v3-3-4.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify isolated simulator release and coherent version
        run: |
          test "$GITHUB_REF_NAME" = "fix/v3.3.5-simple-grid-and-pv"
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("custom_components/power_manager")
          assert json.loads((base/"manifest.json").read_text())["version"] == "3.3.5"
          assert 'VERSION = "3.3.5"' in (base/"const.py").read_text()
          assert '"3.3.5"' in (base/"frontend"/"power-manager-card.js").read_text()
          assert Path("docs/RELEASE_NOTES_V3_3_5.md").is_file()
          source = (base/"controller.py").read_text()
          assert "battery_assist_allowed" not in source
          assert "hybrid_probe_until_s = probe_until_s" not in source
          assert "export_kw = max(0.0, -inputs.grid_kw)" in source
          assert Path("docs/RELEASE_NOTES_V3_3_4.md").is_file()
          PY
      - name: Automated controller and packaging regression checks
        run: |
          python -m pip install pytest
          python -m compileall -q custom_components/power_manager
          node --check custom_components/power_manager/frontend/power-manager-card.js
          python -m pytest -q
      - name: Publish immutable TEST-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.3.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.3.5 exists; refusing to move the tag"
            gh release view v3.3.5 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
            exit 0
          fi
          gh release create v3.3.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Power Manager v3.3.5 – Netz-PMAX und PV-Überschuss (Simulator-Test)' \
            --notes-file docs/RELEASE_NOTES_V3_3_4.md \
            --prerelease
          gh release view v3.3.5 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish
